services:
  mongo:
    image: mongo:7
    container_name: ihracat_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Veritabanı sadece iç ağda; dışarıya port açılmaz.

  backend:
    build: ./backend
    container_name: ihracat_backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    expose:
      - "8001"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_URL}
    container_name: ihracat_frontend
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    container_name: ihracat_proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo_data:
